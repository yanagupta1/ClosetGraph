<svg width="960" height="460" viewBox="0 0 960 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ClosetGraph roadmap diagram</title>
  <desc id="desc">A staged roadmap from design through notebook core, RAG and evals, tool context, research, vision, memory, observability, UI, and deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-core { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 8; }
      .box-later { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .title { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 14px Arial, sans-serif; }
      .small { fill: #475569; font: 12px Arial, sans-serif; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .loop { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrowDashed); }
    </style>
  </defs>

  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="42">ClosetGraph Development Roadmap</text>
  <text class="small" x="40" y="64">Notebook-first core, then retrieval, tools, memory, observability, UI, and deployment.</text>

  <rect class="box" x="40" y="105" width="130" height="76"/>
  <text class="label" x="62" y="134">Stage 0</text>
  <text class="small" x="62" y="155">Design</text>
  <text class="small" x="62" y="171">schemas, graph</text>

  <rect class="box-core" x="210" y="105" width="150" height="76"/>
  <text class="label" x="232" y="134">Stage 1</text>
  <text class="small" x="232" y="155">Walking skeleton</text>
  <text class="small" x="232" y="171">notebook core</text>

  <rect class="box-core" x="400" y="105" width="150" height="76"/>
  <text class="label" x="422" y="134">Stage 2</text>
  <text class="small" x="422" y="155">Style RAG</text>
  <text class="small" x="422" y="171">and evals</text>

  <rect class="box" x="590" y="105" width="150" height="76"/>
  <text class="label" x="612" y="134">Stage 3</text>
  <text class="small" x="612" y="155">Tool context</text>
  <text class="small" x="612" y="171">weather, web path</text>

  <rect class="box" x="780" y="105" width="140" height="76"/>
  <text class="label" x="802" y="134">Stage 4</text>
  <text class="small" x="802" y="155">Research agent</text>
  <text class="small" x="802" y="171">occasion context</text>

  <rect class="box-later" x="210" y="270" width="150" height="76"/>
  <text class="label" x="232" y="299">Stage 5</text>
  <text class="small" x="232" y="320">Vision input</text>
  <text class="small" x="232" y="336">photo to schema</text>

  <rect class="box-later" x="400" y="270" width="150" height="76"/>
  <text class="label" x="422" y="299">Stage 6</text>
  <text class="small" x="422" y="320">Memory upgrade</text>
  <text class="small" x="422" y="336">compaction</text>

  <rect class="box-later" x="590" y="270" width="150" height="76"/>
  <text class="label" x="612" y="299">Stage 7</text>
  <text class="small" x="612" y="320">Observability</text>
  <text class="small" x="612" y="336">traces, metrics</text>

  <rect class="box-later" x="780" y="270" width="140" height="76"/>
  <text class="label" x="802" y="299">Stage 8</text>
  <text class="small" x="802" y="320">UI and deploy</text>
  <text class="small" x="802" y="336">HF Spaces</text>

  <line class="arrow" x1="170" y1="143" x2="202" y2="143"/>
  <line class="arrow" x1="360" y1="143" x2="392" y2="143"/>
  <line class="arrow" x1="550" y1="143" x2="582" y2="143"/>
  <line class="arrow" x1="740" y1="143" x2="772" y2="143"/>
  <path class="arrow" d="M850 181 C850 225 285 225 285 262"/>
  <line class="arrow" x1="360" y1="308" x2="392" y2="308"/>
  <line class="arrow" x1="550" y1="308" x2="582" y2="308"/>
  <line class="arrow" x1="740" y1="308" x2="772" y2="308"/>

  <path class="loop" d="M475 270 C475 225 475 225 475 189"/>
  <text class="small" x="495" y="232">eval failures</text>

  <path class="loop" d="M665 270 C665 225 475 225 475 189"/>
  <text class="small" x="610" y="214">trace findings</text>

  <path class="loop" d="M285 270 C285 225 285 225 285 189"/>
  <text class="small" x="303" y="246">schema gaps</text>
</svg>
