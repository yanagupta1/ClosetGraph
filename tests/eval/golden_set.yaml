# Golden eval set (type-tagged draft - review the `type` on each entry).
#
# `type` determines how the harness evaluates an entry:
#   ranking_preference - an assertion about the full ranking (an item or combo
#                        should / should not appear near the top). Auto-checked.
#   behavioral         - a capability we OBSERVE rather than force (e.g. the
#                        model recognizes a combo as viable). Collected for
#                        rubric/manual review, NOT pass/fail. The former
#                        combination_appears_ranked cases moved here so they no
#                        longer demand a specific top-5 slot; the pairwise
#                        compositional version lives in pairwise_set.yaml.
# Hard constraints (ownership, one top + one bottom, no duplicates) are enforced
# on every ranked output by the harness via validity.py, not per-entry here.

