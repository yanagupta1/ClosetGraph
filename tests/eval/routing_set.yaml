# Supervisor routing labels (benchmark - set independently, by principle).
#
# Evaluates the supervisor in ISOLATION: run supervise(occasion) only, no
# research agent and no stylist. expected_research is the label; reason is the
# human rationale. The deterministic skip handles the plain familiar cases; the
# rest defer to the LLM classifier, so those outcomes are measured, not fixed.
#
# Governing principle: research is warranted ONLY when external information could
# resolve a CONCRETE attire uncertainty that MATERIALLY changes styling. An
# occasion sounding unfamiliar, cultural, or themed is NOT by itself enough if
# the attire is broadly inferable from general knowledge.

# Familiar occasions, attire inferable -> skip
- id: r01
  occasion: "first client meeting, conservative office"
  expected_research: false
  reason: "business/professional is a known, inferable dress code"
- id: r02
  occasion: "casual weekend brunch with friends"
  expected_research: false
  reason: "plainly casual"
- id: r03
  occasion: "team happy hour at a bar"
  expected_research: false
  reason: "casual to smart-casual, inferable"
- id: r04
  occasion: "job interview at a law firm"
  expected_research: false
  reason: "interview formality is well understood"
- id: r05
  occasion: "dinner date at an upscale restaurant"
  expected_research: false
  reason: "upscale dinner implies smart/formal, inferable"
- id: r06
  occasion: "cocktail party at a friend's apartment"
  expected_research: false
  reason: "cocktail is a known dress code"
- id: r07
  occasion: "black-tie wedding"
  expected_research: false
  reason: "black tie is an explicitly known dress code"
- id: r08
  occasion: "running errands and grabbing coffee"
  expected_research: false
  reason: "no dress code"

